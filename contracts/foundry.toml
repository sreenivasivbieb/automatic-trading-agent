[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "../.tools/solc/solc-0.8.24"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = ["@openzeppelin/contracts/=lib/openzeppelin/"]
fs_permissions = [{ access = "read", path = "../.runtime" }]

[profile.default.fuzz]
runs = 256

[fmt]
line_length = 100
